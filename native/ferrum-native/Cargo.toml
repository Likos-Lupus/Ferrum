[package]
name = "ferrum-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Ferrum native kernel with a Minecraft-independent C ABI."

[lib]
name = "ferrum"
crate-type = ["cdylib", "rlib"]

[features]
# Test-only entry points (for example an intentional panic) used to exercise error handling.
test-hooks = []

[profile.release]
lto = true
codegen-units = 1
