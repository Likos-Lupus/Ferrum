name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java checks (4 Stonecutter targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Gradle check (compile, -Werror, Error Prone/NullAway, JUnit 6, guards)
        run: >-
          ./gradlew --no-daemon
          :java-shared:module-api:check
          :java-shared:core-runtime:check
          :java-shared:testkit:check
          :modules:ferrum-core:chiseledCheck
          :modules:ferrum-nbt:chiseledCheck
          :modules:ferrum-codec:chiseledCheck
          :modules:ferrum-palette:chiseledCheck

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/ferrum-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ferrum-native
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --features test-hooks -- -D warnings
      - name: cargo test
        run: cargo test --locked --features test-hooks

  ffm-native:
    name: FFM native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ferrum-native
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Real FFM binding tests against libferrum
        run: >-
          ./gradlew --no-daemon
          :java-shared:core-runtime:nativeTest
          :modules:ferrum-nbt:26.1.2-fabric:nativeTest
          :modules:ferrum-codec:26.1.2-fabric:nativeTest
          :modules:ferrum-palette:26.1.2-fabric:nativeTest

  nbt-golden:
    name: NBT golden corpus is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Regenerate the MUTF-8 corpus
        run: ./gradlew --no-daemon :modules:ferrum-nbt:26.1.2-fabric:generateNbtGolden
      - name: Fail if the committed corpus drifted
        run: git diff --exit-code native/ferrum-native/tests/golden/nbt

  lz4-golden:
    name: LZ4 golden corpus is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Regenerate the lz4-java block-stream corpus
        run: ./gradlew --no-daemon :modules:ferrum-codec:26.1.2-fabric:generateLz4Golden
      - name: Fail if the committed corpus drifted
        run: git diff --exit-code native/ferrum-native/tests/golden/lz4

  palette-golden:
    name: Palette golden corpora are reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Regenerate the SimpleBitStorage and remap corpora
        run: ./gradlew --no-daemon :modules:ferrum-palette:26.1.2-fabric:generatePaletteGolden
      - name: Fail if the committed corpora drifted
        run: >-
          git diff --exit-code
          native/ferrum-native/tests/golden/palette
          native/ferrum-native/tests/golden/palette-remap

  fuzz:
    name: Fuzz (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/ferrum-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the NBT parser
        run: cargo +nightly fuzz run nbt_parse -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz the LZ4 block-stream decoder
        run: cargo +nightly fuzz run lz4_decode -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz the palette unpack
        run: cargo +nightly fuzz run palette_unpack -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz the palette pack
        run: cargo +nightly fuzz run palette_pack -- -max_total_time=60 -rss_limit_mb=2048

  abi-drift:
    name: ABI drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify ABI version and symbol surface
        run: bash scripts/check-abi.sh
      - name: Verify the test-hooks symbol surface
        run: bash scripts/check-abi.sh --test-hooks

  remap:
    name: 4-target remap (push/schedule)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Remap and collect every target
        run: >-
          ./gradlew --no-daemon
          :modules:ferrum-core:chiseledBuildAndCollect
          :modules:ferrum-nbt:chiseledBuildAndCollect
          :modules:ferrum-codec:chiseledBuildAndCollect
          :modules:ferrum-palette:chiseledBuildAndCollect
