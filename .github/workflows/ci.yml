name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java checks (4 Stonecutter targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Gradle check (compile, -Werror, Error Prone/NullAway, JUnit 6, guards)
        run: >-
          ./gradlew --no-daemon
          :java-shared:module-api:check
          :java-shared:core-runtime:check
          :java-shared:testkit:check
          :modules:ferrum-core:chiseledCheck

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/ferrum-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ferrum-native
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --features test-hooks -- -D warnings
      - name: cargo test
        run: cargo test --locked --features test-hooks

  ffm-native:
    name: FFM native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ferrum-native
      - uses: gradle/actions/setup-gradle@v6
      - name: Real FFM binding tests against libferrum
        run: ./gradlew --no-daemon :java-shared:core-runtime:nativeTest

  abi-drift:
    name: ABI drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify ABI version and symbol surface
        run: bash scripts/check-abi.sh

  remap:
    name: 4-target remap (push/schedule)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Remap and collect every target
        run: ./gradlew --no-daemon :modules:ferrum-core:chiseledBuildAndCollect
